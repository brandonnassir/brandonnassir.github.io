<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Math Problems - Combined 3D Visualization</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 24px;
            max-width: 1800px;
            margin: 0 auto;
            height: calc(100vh - 40px);
        }
        .plot-container {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .side-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .preview-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }
        .preview-header {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        .preview-placeholder {
            color: #94a3b8;
            font-style: italic;
            text-align: center;

        }
        .problem-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .badge {

            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-domain {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-skill {
            background: #f3e8ff;
            color: #6b21a8;
        }
        .badge-difficulty-1 {
            background: #dcfce7;
            color: #166534;
        }
        .badge-difficulty-2 {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-difficulty-3 {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-type {
            background: #f1f5f9;
            color: #475569;
        }
        .problem-text {
            font-size: 15px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 16px;
        }
        .options-container {
            margin-top: 16px;
        }
        .options-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }
        .option {
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #334155;
            border-left: 3px solid #3b82f6;
        }
        .option-label {
            font-weight: 600;
            color: #3b82f6;
            margin-right: 8px;
        }
        .legend-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

            max-height: 300px;
            overflow-y: auto;
        }

            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
        }

            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 14px;
            color: #475569;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;

        }

            flex: 1;
            min-height: 400px;
        }

            font-weight: 700;
            color: #0f172a;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 16px;
        }

            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pinned-indicator:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
        }
        .pinned-indicator.active {
            display: flex;
        }
        .pinned-indicator svg {
            width: 14px;
            height: 14px;
        }
        
        /* Tab styles */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tab-button {
            padding: 10px 24px;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-button:hover {
            background: #e2e8f0;
            color: #475569;
        }
        .tab-button.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
        .tab-button.active:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="plot-container">
            <div class="main-title" id="main-title">SAT Math Problems - t-SNE 3D (by Difficulty)</div>
            <div class="subtitle">Rotate: drag • Zoom: scroll • Click to pin problem details</div>
            
            <div class="tabs-container">
                <button id="tab-difficulty" class="tab-button active" onclick="switchTab('difficulty')">Difficulty</button>
                <button id="tab-domain" class="tab-button" onclick="switchTab('domain')">Domain</button>
                <button id="tab-skill" class="tab-button" onclick="switchTab('skill')">Skill</button>
            </div>
            
            <div id="plot"></div>
        </div>
        <div class="side-panel">
            <div class="preview-card">
                <div class="preview-header">Problem Preview</div>
                <div id="pinned-indicator" class="pinned-indicator" onclick="unpinPoint()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                    </svg>
                    <span>Pinned — Click to unpin</span>
                </div>
                <div id="preview-content">
                    <div class="preview-placeholder">
                        Hover over a point to preview • Click to pin
                    </div>
                </div>
            </div>
            <div class="legend-card">
                <div class="legend-title" id="legend-title">Difficulty</div>
                <div id="legend-items">
                </div>
            </div>
        </div>
    </div>

eek. \\[ \\begin{array}{|c|ccc|} \\hline \\text{Hours practiced} & \\text{6 to 13 points} & \\text{14 or more points} & \\text{Total} \\\\ \\hline 3 \\text{ to } 5 \\text{ hours} & 6 & 4 & 10 \\\\ \\text{More than 5 hours} & 4 & 26 & 30 \\\\ \\hline \\text{Total} & 10 & 30 & 40 \\\\ \\hline \\end{array} \\]", "options": ["All trivia teams in the tournament that scored 14 or more points in the round", "The 55 trivia teams in the sample", "The 40 trivia teams in the sample that practiced for at least 3 hours per week", "All trivia teams in the tournament"]}, {"id": "82dfb646", "domain": "Problem-Solving and Data Analysis", "skill": "Evaluating statistical claims: Observational studies and experiments", "difficulty": 2, "problem_type": "MC", "problem_text": "A market researcher selected 200 people at random from a group of people who indicated that they liked a certain book. The 200 people were shown a movie based on the book and then asked whether they liked or disliked the movie. Of those surveyed, 95\\% said they disliked the movie. Which of the following inferences can appropriately be drawn from this survey result?", "options": ["At least 95\\% of people who go see movies will dislike this movie.", "At least 95\\% of people who read books will dislike this movie.", "Most people who dislike this book will like this movie.", "Most people who like this book will dislike this movie."]}, {"id": "9bf4c545", "domain": "Problem-Solving and Data Analysis", "skill": "Evaluating statistical claims: Observational studies and experiments", "difficulty": 2, "problem_type": "MC", "problem_text": "The members of a city council wanted to assess the opinions of all city residents about converting an open field into a dog park. The council surveyed a sample of 500 city residents who own dogs. The survey showed that the majority of those sampled were in favor of the dog park. Which of the following is true about the city council\u2019s survey?", "options": ["It shows that the majority of city residents are in favor of the dog park.", "The survey sample should have included more residents who are dog owners.", "The survey sample should have consisted entirely of residents who do not own dogs.", "The survey sample is biased because it is not representative of all city residents."]}, {"id": "aa43b41f", "domain": "Problem-Solving and Data Analysis", "skill": "Evaluating statistical claims: Observational studies and experiments", "difficulty": 3, "problem_type": "MC", "problem_text": "Near the end of a US cable news show, the host invited viewers to respond to a poll on the show\u2019s website that asked, \u201cDo you support the new federal policy discussed during the show?\u201d At the end of the show, the host reported that 28\\% responded \u201cYes,\u201d and 70\\% responded \u201cNo.\u201d Which of the following best explains why the results are unlikely to represent the sentiments of the population of the United States?", "options": ["The percentages do not add up to 100\\%, so any possible conclusions from the poll are invalid.", "Those who responded to the poll were not a random sample of the population of the United States.", "There were not 50\\% \u201cYes\u201d responses and 50\\% \u201cNo\u201d responses.", "The show did not allow viewers enough time to respond to the poll."]}, {"id": "b4f5a7ca", "domain": "Problem-Solving and Data Analysis", "skill": "Evaluating statistical claims: Observational studies and experiments", "difficulty": 2, "problem_type": "MC", "problem_text": "A survey was conducted using a sample of history professors selected at random from the California State Universities. The professors surveyed were asked to name the publishers of their current texts. What is the largest population to which the results of the survey can be generalized?", "options": ["All professors in the United States", "All history professors in the United States", "All history professors at all California State Universities", "All professors at all California State Universities"]}, {"id": "0108ac2d", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "At a large high school, 300 students were selected at random and were asked in a survey about a menu change in the school cafeteria. All 300 students completed the survey. It was estimated that 38\\% of the students were in support of a menu change, with a margin of error of 5.5\\%. Which of the following is the best interpretation of the survey results?", "options": ["The percent of the students at the school who support a menu change is 38\\%.", "The percent of the students at the school who support a menu change is greater than 38\\%.", "Plausible values of the percent of the students at the school who support a menu change are between 32.5\\% and 43.5\\%.", "Plausible values of the number of the students at the school who support a menu change are between 295 and 305."]}, {"id": "1e562f24", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "To estimate the proportion of a population that has a certain characteristic, a random sample was selected from the population. Based on the sample, it is estimated that the proportion of the population that has the characteristic is \\(0.49\\), with an associated margin of error of \\(0.04\\). Based on this estimate and margin of error, which of the following is the most appropriate conclusion about the proportion of the population that has the characteristic?", "options": ["It is plausible that the proportion is between \\(0.45\\) and \\(0.53\\).", "It is plausible that the proportion is less than \\(0.45\\).", "The proportion is exactly \\(0.49\\).", "It is plausible that the proportion is greater than \\(0.53\\)."]}, {"id": "308084c5", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 3, "problem_type": "MC", "problem_text": "The results of two random samples of votes for a proposition are shown above. The samples were selected from the same population, and the margins of error were calculated using the same method. Which of the following is the most appropriate reason that the margin of error for sample A is greater than the margin of error for sample B? \\begin{table}[h] \\centering \\begin{tabular}{|c|c|c|} \\hline \\textbf{Sample} & \\textbf{Percent in favor} & \\textbf{Margin of error} \\\\ \\hline A & $52\\%$ & $4.2\\%$ \\\\ \\hline B & $48\\%$ & $1.6\\%$ \\\\ \\hline \\end{tabular} \\end{table}", "options": ["Sample A had a smaller number of votes that could not be recorded.", "Sample A had a higher percent of favorable responses.", "Sample A had a larger sample size.", "Sample A had a smaller sample size."]}, {"id": "4096a482", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "Based on a random sample from a population, a researcher estimated that the mean value of a certain variable for the population is 20.5, with an associated margin of error of 1. Which of the following is the most appropriate conclusion?", "options": ["It is plausible that the actual mean value of the variable for the population is between 19.5 and 21.5.", "It is not possible that the mean value of the variable for the population is less than 19.5 or greater than 21.5.", "Every value of the variable in the population is between 19.5 and 21.5.", "The mean value of the variable for the population is 20.5."]}, {"id": "53d97af5", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A study was done on the weights of different types of fish in a pond. A random sample of fish were caught and marked in order to ensure that none were weighed more than once. The sample contained 150 largemouth bass, of which 30\\% weighed more than 2 pounds. Which of the following conclusions is best supported by the sample data?", "options": ["The majority of all fish in the pond weigh less than 2 pounds.", "The average weight of all fish in the pond is approximately 2 pounds.", "Approximately 30\\% of all fish in the pond weigh more than 2 pounds.", "Approximately 30\\% of all largemouth bass in the pond weigh more than 2 pounds."]}, {"id": "6a305cd0", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "In a study, the data from a random sample of a population had a mean of 37, with an associated margin of error of 3. Which of the following is the most appropriate conclusion that can be made about the population mean?", "options": ["It is less than 37.", "It is greater than 37.", "It is between 34 and 40.", "It is less than 34 or greater than 40."]}, {"id": "8173f32b", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "An analyst collected data on the price of a carton of grape tomatoes at 30 locations selected at random in Utah. The mean price of a carton of grape tomatoes in Utah was estimated to be \\$4.23, with an associated margin of error of \\$0.08. Which of the following is a plausible statement about the mean price of a carton of grape tomatoes for all locations that sell this product in Utah?", "options": ["It is between \\$4.15 and \\$4.31.", "It is either less than \\$4.15 or greater than \\$4.31.", "It is less than \\$4.15.", "It is greater than \\$4.31."]}, {"id": "85939da5", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 3, "problem_type": "MC", "problem_text": "In a study of cell phone use, 799 randomly selected US teens were asked how often they talked on a cell phone and about their texting behavior. The data are summarized in the table above. Based on the data from the study, an estimate of the percent of US teens who are heavy texters is 30\\% and the associated margin of error is 3\\%. Which of the following is a correct statement based on the given margin of error?", "options": ["Approximately 3\\% of the teens in the study who are classified as heavy texters are not really heavy texters.", "It is not possible that the percent of all US teens who are heavy texters is less than 27\\%.", "The percent of all US teens who are heavy texters is 33\\%.", "It is doubtful that the percent of all US teens who are heavy texters is 35\\%."]}, {"id": "89f8d08a", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A store manager reviewed the receipts from 80 customers who were selected at random from all the customers who made purchases last Thursday. Of those selected, 20 receipts showed that the customer had purchased fruit. If 1,500 customers made purchases last Thursday, which of the following is the most appropriate conclusion?", "options": ["Exactly 75 customers must have purchased fruit last Thursday.", "Exactly 375 customers must have purchased fruit last Thursday.", "The best estimate for the number of customers who purchased fruit last Thursday is 75.", "The best estimate for the number of customers who purchased fruit last Thursday is 375."]}, {"id": "90eed2e5", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A city has 50 city council members. A reporter polled a random sample of 20 city council members and found that 6 of those polled supported a specific bill. Based on the sample, which of the following is the best estimate of the number of city council members in the city who support the bill?", "options": ["6", "9", "15", "30"]}, {"id": "916ffe9b", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 3, "problem_type": "MC", "problem_text": "The table shows the results of a poll. A total of 803 voters selected at random were asked which candidate they would vote for in the upcoming election. According to the poll, if 6,424 people vote in the election, by how many votes would Angel Cruz be expected to win? \\[ \\begin{array}{|c|c|} \\hline \\textbf{Poll Results} & \\\\ \\hline \\text{Angel Cruz} & 483 \\\\ \\hline \\text{Terry Smith} & 320 \\\\ \\hline \\end{array} \\]", "options": ["163", "1,304", "3,864", "5,621"]}, {"id": "97631565", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "Scott selected 20 employees at random from all 400 employees at a company. He found that 16 of the employees in this sample are enrolled in exactly three professional development courses this year. Based on Scott\u2019s findings, which of the following is the best estimate of the number of employees at the company who are enrolled in exactly three professional development courses this year?", "options": ["4", "320", "380", "384"]}, {"id": "9ba3e283", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 3, "problem_type": "MC", "problem_text": "In State X, Mr. Camp\u2019s eighth-grade class consisting of 26 students was surveyed and 34.6 percent of the students reported that they had at least two siblings. The average eighth-grade class size in the state is 26. If the students in Mr. Camp\u2019s class are representative of students in the state\u2019s eighth-grade classes and there are 1,800 eighth-grade classes in the state, which of the following best estimates the number of eighth-grade students in the state who have fewer than two siblings?", "options": ["16,200", "23,400", "30,600", "46,800"]}, {"id": "9bedc4a0", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A company that produces socks wants to estimate the percent of the socks produced in a typical week that are defective. A random sample of 310 socks produced in a certain week were inspected. Based on the sample, it is estimated that \\( 12\\% \\) of all socks produced by the company in this week are defective, with an associated margin of error of \\( 3.62\\% \\). Based on the estimate and associated margin of error, which of the following is the most appropriate conclusion about all socks produced by the company during this week?", "options": ["\\( 3.62\\%\\) of the socks are defective.", "It is plausible that between \\( 8.38\\%\\) and \\( 15.62\\%\\) of the socks are defective.", "\\( 12\\%\\) of the socks are defective.", "It is plausible that more than \\( 15.62\\%\\) of the socks are defective."]}, {"id": "9ee22c16", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "SA", "problem_text": "A random sample of 400 town voters were asked if they plan to vote for Candidate A or Candidate B for mayor. The results were sorted by gender and are shown in the table below. \\[ \\begin{array}{|c|c|c|} \\hline & \\text{Plan to vote for Candidate A} & \\text{Plan to vote for Candidate B} \\\\ \\hline \\text{Female} & 202 & 20 \\\\ \\hline \\text{Male} & 34 & 144 \\\\ \\hline \\end{array} \\] The town has a total of 6,000 voters. Based on the table, what is the best estimate of the number of voters who plan to vote for Candidate A?", "options": []}, {"id": "a2162ea1", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A company fills boxes with approximately 23 pounds of oranges. To test the accuracy of the filling process, 344 boxes of oranges were selected at random and weighed. Based on the sample, it is estimated that the average weight of all boxes of oranges filled by the company in an 8-hour period is 23.1 pounds, with an associated margin of error of 0.19 pounds. Which of the following is the best interpretation of this estimate?", "options": ["Plausible values for the average weight of all boxes of oranges filled by the company are between 22.91 pounds and 23.29 pounds.", "Plausible values for the average weight of all boxes of oranges filled by the company are less than 22.91 pounds or greater than 23.29 pounds.", "The average weight of all boxes of oranges filled by the company is less than 23.01 pounds.", "The average weight of all boxes of oranges filled by the company is greater than 23.01 pounds."]}, {"id": "affb2315", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "There are 55 students in Spanish club. A sample of the Spanish club students was selected at random and asked whether they intend to enroll in a new study program. Of those surveyed, 20\\% responded that they intend to enroll in the study program. Based on this survey, which of the following is the best estimate of the total number of Spanish club students who intend to enroll in the study program?", "options": ["11", "20", "44", "55"]}, {"id": "c7e73ece", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 3, "problem_type": "SA", "problem_text": "A researcher interviewed 411 randomly selected US residents and asked about their views on the use of nuclear energy. The table below summarizes the responses of the interviewees. \\[ \\begin{array}{|c|c|} \\hline \\text{Response} & \\text{Frequency} \\\\ \\hline \\text{Strongly favor} & 56 \\\\ \\text{Somewhat favor} & 214 \\\\ \\text{Somewhat oppose} & 104 \\\\ \\text{Strongly oppose} & 37 \\\\ \\hline \\end{array} \\] If the population of the United States was 300 million when the survey was given, based on the sample data for the 411 US residents, what is the best estimate, in \\emph{millions}, of the difference between the number of US residents who somewhat favor or strongly favor the use of nuclear energy and the number of those who somewhat oppose or strongly oppose it? (Round your answer to the nearest whole number.)", "options": []}, {"id": "e03f3477", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A sample consisting of 720 adults who own televisions was selected at random for a study. Based on the sample, it is estimated that 32\\% of all adults who own televisions use their televisions to watch nature shows, with an associated margin of error of 3.41\\%. Which of the following is the most plausible conclusion about all adults who own televisions?", "options": ["More than 35.41\\% of all adults who own televisions use their televisions to watch nature shows.", "Between 28.59\\% and 35.41\\% of all adults who own televisions use their televisions to watch nature shows.", "Since the sample included adults who own televisions and not just those who use their televisions to watch nature shows, no conclusion can be made.", "Since the sample did not include all the people who watch nature shows, no conclusion can be made."]}, {"id": "e7d9649f", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 1, "problem_type": "MC", "problem_text": "A random sample of 50 people from a town with a population of 14,878 were asked to name their favorite flavor of ice cream. If 7 people in the sample named chocolate as their favorite ice-cream flavor, about how many people in the town would be expected to name chocolate?", "options": ["350", "2,100", "7,500", "10,500"]}, {"id": "f04d40b2", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "From a population of 50,000 people, 1,000 were chosen at random and surveyed about a proposed piece of legislation. Based on the survey, it is estimated that \\(35\\%\\) of people in the population support the legislation, with an associated margin of error of \\(3\\%\\). Based on these results, which of the following is a plausible value for the total number of people in the population who support the proposed legislation?", "options": ["350", "650", "16,750", "31,750"]}, {"id": "f4b3672a", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A certain forest is 253 acres. To estimate the number of trees in the forest, a ranger randomly selects 5 different 1-acre parcels in the forest and determines the number of trees in each parcel. The numbers of trees in the sample acres are 51, 59, 45, 52, and 73. Based on the mean of the sample, which of the following ranges contains the best estimate for the number of trees in the entire forest?", "options": ["11,000 to 12,000", "12,500 to 13,500", "13,500 to 14,500", "18,000 to 19,000"]}, {"id": "f8f79e11", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A park ranger asked a random sample of visitors how far they hiked during their visit. Based on the responses, the estimated mean was found to be 4.5 miles, with an associated margin of error of 0.5 miles. Which of the following is the best conclusion from these data?", "options": ["It is likely that all visitors hiked between 4 and 5 miles.", "It is likely that most visitors hiked exactly 4.5 miles.", "It is not possible that any visitor hiked less than 3 miles.", "It is plausible that the mean distance hiked for all visitors is between 4 and 5 miles."]}, {"id": "fc46af57", "domain": "Problem-Solving and Data Analysis", "skill": "Inference from sample statistics and margin of error", "difficulty": 2, "problem_type": "MC", "problem_text": "A bag containing 10,000 beads of assorted colors is purchased from a craft store. To estimate the percent of red beads in the bag, a sample of beads is selected at random. The percent of red beads in the bag was estimated to be 15\\%, with an associated margin of error of 2\\%. If \\( r \\) is the actual number of red beads in the bag, which of the following is most plausible?", "options": ["\\( r > 1,700 \\)", "\\( 1,300 < r < 1,700 \\)", "\\( 200 < r < 1,500 \\)", "\\( r < 1,300 \\)"]}, {"id": "07f2829b", "domain": "Problem-Solving and Data Analysis", "skill": "One-variable data: Distributions and measures of center and spread", "difficulty": 2, "problem_type": "SA", "problem_text": "The table below shows the number of international tourist arrivals, rounded to the nearest tenth of a million, to the top nine tourist destinations in both 2012 and 2013. Based on the information given in the table, how much greater, in millions, was the median number of international tourist arrivals to the top nine tourist destinations in 2013 than the median number in 2012, to the nearest tenth of a million? \\[ \\begin{array}{|c|c|c|} \\hline \\text{Country} & \\text{2012} & \\text{2013} \\\\ \\hline \\text{France} & 83.0 & 84.7 \\\\ \\hline \\text{United States} & 66.7 & 69.8 \\\\ \\hline \\text{Spain} & 57.5 & 60.7 \\\\ \\hline \\text{China} & 57.7 & 55.7 \\\\ \\hline \\text{Italy} & 46.4 & 47.7 \\\\ \\hline \         // State management

        let lastHoveredIndex = -1;
        let currentCategory = 'difficulty';
        
        // Tab switching
        function switchTab(category) {
            currentCategory = category;
            
            // Update tab button styles
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('tab-' + category).classList.add('active');
            
            // Update plot colors
            Plotly.restyle('plot', {
                'marker.color': [colorData[category]]
            }, [0]);
            
            // Update legend
            updateLegend(category);
            
            // Update title
            const displayNames = {
                'difficulty': 'Difficulty',
                'domain': 'Domain',
                'skill': 'Skill'
            };
            document.getElementById('main-title').textContent = 
                'SAT Math Problems - t-SNE 3D (by ' + displayNames[category] + ')';
        }
        
        function updateLegend(category) {
            const config = legendConfigs[category];
            let html = '';
            
            config.order.forEach(cat => {
                html += '<div class="legend-item">' +
                    '<div class="legend-color" style="background: ' + config.colors[cat] + ';"></div>' +
                    '<div class="legend-label">' + config.labels[cat] + '</div>' +
                '</div>';
            });
            
            document.getElementById('legend-items').innerHTML = html;
            document.getElementById('legend-title').textContent = config.displayName;
        }
        
        // Wait for DOM to be ready then render plot
        function initPlot() {
            const plotDiv = document.getElementById('plot');
            
            // Create the plot with initial difficulty colors
            Plotly.newPlot('plot', figData.data, figData.layout, {
                responsive: true,
                displayModeBar: true,
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            }).then(function() {
                // Force a resize after initial render
                Plotly.Plots.resize('plot');
            });
            
            // Handle hover events
            plotDiv.on('plotly_hover', function(data) {
                // If a point is pinned, don't respond to hover
                if (pinnedIndex !== -1) return;
                
                if (!data || !data.points || !data.points[0]) return;
                
                const point = data.points[0];
                const pointIndex = point.pointNumber !== undefined ? point.pointNumber : point.pointIndex;
                
                if (pointIndex === undefined || pointIndex === lastHoveredIndex) return;
                lastHoveredIndex = pointIndex;
                
                if (pointIndex >= 0 && pointIndex < problemData.length) {
                    const problem = problemData[pointIndex];
                    if (problem) {
                        updatePreview(problem);
                    }
                }
            });
            
            plotDiv.on('plotly_unhover', function(data) {
                if (pinnedIndex === -1) {
                    lastHoveredIndex = -1;
                }
            });
            
            // Handle click events for pinning
            plotDiv.on('plotly_click', function(data) {
                if (!data || !data.points || !data.points[0]) return;
                
                const point = data.points[0];
                const pointIndex = point.pointNumber !== undefined ? point.pointNumber : point.pointIndex;
                
                if (pointIndex === undefined || pointIndex < 0 || pointIndex >= problemData.length) return;
                
                // If clicking the same point, unpin
                if (pinnedIndex === pointIndex) {
                    unpinPoint();
                    return;
                }
                
                // Pin the new point
                pinPoint(pointIndex);
            });
            
            // Initialize legend
            updateLegend('difficulty');
        }
        
        function pinPoint(pointIndex) {
            pinnedIndex = pointIndex;
            const problem = problemData[pointIndex];
            
            updatePreview(problem);
            
            // Show pinned indicator
            document.getElementById('pinned-indicator').classList.add('active');
        }
        
        function unpinPoint() {
            pinnedIndex = -1;
            lastHoveredIndex = -1;
            
            // Hide pinned indicator
            document.getElementById('pinned-indicator').classList.remove('active');
            
            // Reset preview
            document.getElementById('preview-content').innerHTML = 
                '<div class="preview-placeholder">Hover over a point to preview • Click to pin</div>';
        }
        
        function updatePreview(problem) {
            if (!problem) return;
            
            const difficultyLabels = {1: 'Easy', 2: 'Medium', 3: 'Hard'};
            
            let optionsHtml = '';
            if (problem.options && Array.isArray(problem.options) && problem.options.length > 0) {
                const optionLabels = ['A', 'B', 'C', 'D'];
                optionsHtml = '<div class="options-container"><div class="options-title">Answer Choices</div>';
                problem.options.forEach((opt, i) => {
                    optionsHtml += '<div class="option"><span class="option-label">' + optionLabels[i] + '.</span>' + opt + '</div>';
                });
                optionsHtml += '</div>';
            }
            
            const html = 
                '<div class="problem-meta">' +
                    '<span class="badge badge-domain">' + (problem.domain || 'Unknown') + '</span>' +
                    '<span class="badge badge-skill">' + (problem.skill || 'Unknown') + '</span>' +
                    '<span class="badge badge-difficulty-' + (problem.difficulty || 1) + '">' + (difficultyLabels[problem.difficulty] || 'Unknown') + '</span>' +
                    '<span class="badge badge-type">' + (problem.problem_type === 'MC' ? 'Multiple Choice' : 'Short Answer') + '</span>' +
                '</div>' +
                '<div class="problem-text">' + (problem.problem_text || 'No problem text available') + '</div>' +
                optionsHtml;
            
            document.getElementById('preview-content').innerHTML = html;
            
            // Re-render MathJax for the new content
            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById('preview-content')]);
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPlot);
        } else {
            initPlot();
        }
